name: DUO - verification iOS (manuel)

# Only the explicit validation request triggers a push build; ordinary edits are free.
on:
  push:
    branches: [work/solo-iphone-install-20261105]
    paths: [Docs/duo-solo-install-validation-request.txt]
  workflow_dispatch:
    inputs:
      include_ui_tests:
        description: "Lancer les parcours iPhone requis avant livraison"
        type: boolean
        default: true
        required: true
permissions:
  contents: read
concurrency:
  group: duo-ios-verification
  cancel-in-progress: false
jobs:
  ios-tests:
    name: Swift Core, iPhone et parcours utilisateur
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Afficher Xcode et les SDK disponibles
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Tests du noyau et compilation simulateur
        env:
          DUO_RUN_UI_TESTS: '0'
        run: bash Scripts/check-macos.sh
      - name: Compiler le binaire pour iPhone (sans signature)
        run: |
          set -euo pipefail
          xcodebuild -project DUO.xcodeproj -scheme DUO -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath TestResults/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee TestResults/iphoneos-build.log
          APP="TestResults/DeviceDerivedData/Build/Products/Release-iphoneos/DUO.app"
          test -d "$APP"
          mkdir -p TestResults/ipa/Payload
          ditto "$APP" TestResults/ipa/Payload/DUO.app
          (cd TestResults/ipa && zip -qr ../DUO-solo-unsigned.ipa Payload)
          unzip -t TestResults/DUO-solo-unsigned.ipa
      - name: Parcours iPhone et sauvegardes sur simulateur
        if: ${{ inputs.include_ui_tests || github.event_name == 'push' }}
        run: |
          set -euo pipefail
          DUO_SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in d["devices"].items() if "iOS" in runtime for x in devices if "iPhone" in x["name"]))')"
          xcodebuild -project DUO.xcodeproj -scheme DUO \
            -destination "platform=iOS Simulator,id=$DUO_SIMULATOR_ID" \
            -derivedDataPath TestResults/DerivedData \
            -resultBundlePath TestResults/DUO-UI.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES \
            -skip-testing:DUOUITests/DUOUITests/testAccessibilityAudit \
            test 2>&1 | tee TestResults/ui.log
      - name: Nous deux sur petit iPhone SE
        if: ${{ inputs.include_ui_tests || github.event_name == 'push' }}
        run: |
          set -euo pipefail
          DUO_SMALL_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in d["devices"].items() if "iOS" in runtime for x in devices if "iPhone SE" in x["name"]))')"
          xcodebuild -project DUO.xcodeproj -scheme DUO \
            -destination "platform=iOS Simulator,id=$DUO_SMALL_ID" \
            -derivedDataPath TestResults/DerivedData \
            -resultBundlePath TestResults/DUO-Small.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES \
            -only-testing:DUOUITests/DUOUITests/testCoupleLayoutAndReachableActivities \
            test-without-building 2>&1 | tee TestResults/small-screen.log
      - name: Préparer le paquet identifié et les instructions
        if: ${{ inputs.include_ui_tests || github.event_name == 'push' }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > TestResults/SOURCE-COMMIT.txt
          (cd TestResults && shasum -a 256 DUO-solo-unsigned.ipa > SHA256SUMS.txt)
          cp Docs/DUO-SOLO-INSTALL-WINDOWS.md TestResults/INSTALLATION-WINDOWS.md
          cp Docs/DUO-SOLO-TEST-IPHONE.md TestResults/TEST-IPHONE.md
          printf 'Build simulateur : réussi\nBuild iPhone : réussi\nTests noyau et tests sélectionnés du simulateur : réussis\nIPA non signé, installation physique restant à effectuer.\n' > TestResults/VALIDATION.txt
          ditto -c -k --keepParent TestResults/DerivedData/Build/Products/Debug-iphonesimulator/DUO.app TestResults/DUO-simulator.zip
      - name: IPA validé pour signature personnelle sur Windows
        if: ${{ inputs.include_ui_tests || github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: DUO-solo-validated-${{ github.sha }}
          path: |
            TestResults/DUO-solo-unsigned.ipa
            TestResults/SOURCE-COMMIT.txt
            TestResults/SHA256SUMS.txt
            TestResults/INSTALLATION-WINDOWS.md
            TestResults/TEST-IPHONE.md
            TestResults/VALIDATION.txt
          retention-days: 30
          if-no-files-found: error
      - name: Build simulateur
        if: ${{ inputs.include_ui_tests || github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: DUO-simulator-${{ github.sha }}
          path: TestResults/DUO-simulator.zip
          retention-days: 7
      - name: Rapports de diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duo-xcode-diagnostics-${{ github.sha }}
          path: |
            TestResults/*.log
            TestResults/DUO-UI.xcresult
            TestResults/DUO-Small.xcresult
          retention-days: 7
          if-no-files-found: ignore
