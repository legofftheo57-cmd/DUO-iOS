name: DUO - verification iOS (manuel)

# Manual only: private macOS runner time consumes included GitHub Actions credits.
on:
  # Explicit one-off request only; future source edits will not consume runner minutes.
  push:
    branches:
      - work/solo-iphone-install-20261105
    paths:
      - Docs/duo-solo-ui-build-request-20261105.txt
  workflow_dispatch:
    inputs:
      include_ui_tests:
        description: "Lancer aussi les tests du simulateur iPhone (plus longs)"
        type: boolean
        default: false
        required: true
permissions:
  contents: read

concurrency:
  group: duo-ios-verification
  cancel-in-progress: true

jobs:
  ios-tests:
    name: Swift Core et compilation iOS
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Afficher Xcode et les SDK disponibles
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Tests du noyau et compilation simulateur
        env:
          DUO_RUN_UI_TESTS: '0'
        run: bash Scripts/check-macos.sh
      - name: Compiler le binaire pour iPhone (sans signature)
        if: ${{ github.ref_name == 'work/solo-iphone-install-20261105' }}
        run: |
          set -euo pipefail
          xcodebuild -project DUO.xcodeproj -scheme DUO -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath TestResults/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee TestResults/iphoneos-build.log
          APP="TestResults/DeviceDerivedData/Build/Products/Release-iphoneos/DUO.app"
          test -d "$APP"
          mkdir -p TestResults/ipa/Payload
          ditto "$APP" TestResults/ipa/Payload/DUO.app
          (cd TestResults/ipa && zip -qr ../DUO-solo-unsigned.ipa Payload)
          unzip -t TestResults/DUO-solo-unsigned.ipa
      - name: IPA solo pour signature personnelle sur Windows
        if: ${{ github.ref_name == 'work/solo-iphone-install-20261105' }}
        uses: actions/upload-artifact@v4
        with:
          name: DUO-solo-unsigned-ipa
          path: TestResults/DUO-solo-unsigned.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Parcours iPhone sur simulateur (tests UI)
        if: ${{ inputs.include_ui_tests || github.event_name == 'push' }}
        run: |
          set -euo pipefail
          DUO_SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in d["devices"].items() if "iOS" in runtime for x in devices if "iPhone" in x["name"]))')"
          xcodebuild -project DUO.xcodeproj -scheme DUO \
            -destination "platform=iOS Simulator,id=$DUO_SIMULATOR_ID" \
            -derivedDataPath TestResults/DerivedData \
            -resultBundlePath TestResults/DUO-UI.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES \
            test 2>&1 | tee TestResults/ui.log
      - name: Rapports de diagnostic (journaux uniquement)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duo-xcode-diagnostics
          path: TestResults/*.log
          retention-days: 2
          if-no-files-found: ignore
