name: DUO - build .ipa non signe (manuel)

# Manuel uniquement : le Mac GitHub consomme des minutes incluses.
# L'.ipa produit n'est PAS signe : Sideloadly le re-signe avec l'Apple ID gratuit de l'utilisateur.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Machine (macos-26 pour l IA Apple, macos-15-intel en secours)'
        default: 'macos-26'
      mode:
        description: 'tout = synchro + app ; synchro = seulement le test deux telephones ; captures = app + captures simulateur'
        default: 'tout'

permissions:
  contents: read

concurrency:
  group: duo-ios-build-ipa
  cancel-in-progress: true

jobs:
  synchro:
    name: Test synchro deux telephones (vrai serveur)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deux telephones simules
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: bash Scripts/test-synchro-deux-telephones.sh
  build-ipa:
    if: ${{ inputs.mode != 'synchro' }}
    name: Compilation iPhone (non signe) et .ipa
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Afficher Xcode
        run: xcodebuild -version
      - name: Tests du cerveau et du moteur (Swift)
        run: set -o pipefail; swift test 2>&1 | tail -60
      - name: Compiler pour iPhone sans signature
        env:
          # Secrets GitHub facultatifs : sans eux, DUO reste en mode local (sans compte).
          # Ne JAMAIS mettre la cle service_role ici : uniquement la cle publique (publishable/anon).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then echo "Mode foyer : Supabase configure"; else echo "Mode local : aucun Supabase configure"; fi
          # xcconfig traite // comme un commentaire : on echappe l'URL.
          SB_URL="${SUPABASE_URL/:\/\//:\/\$()\/}"
          printf 'SUPABASE_URL = %s\nSUPABASE_PUBLISHABLE_KEY = %s\n' "$SB_URL" "$SUPABASE_PUBLISHABLE_KEY" > Local.xcconfig
          mkdir -p TestResults
          set -o pipefail
          xcodebuild -project DUO.xcodeproj -scheme DUO \
            -sdk iphoneos -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath TestResults/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee TestResults/build-device.log
      - name: Fabriquer DUO-unsigned.ipa
        run: |
          APP="$(find TestResults/DerivedData/Build/Products -maxdepth 2 -name '*.app' -type d | head -1)"
          echo "App trouvee : $APP"
          test -n "$APP"
          echo "URL du foyer dans l'app : $(plutil -extract SUPABASE_URL raw "$APP/Info.plist" 2>/dev/null || echo 'aucune (mode local)')"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry DUO-unsigned.ipa Payload
          ls -lh DUO-unsigned.ipa
      - name: Publier l'.ipa
        uses: actions/upload-artifact@v4
        with:
          name: DUO-unsigned-ipa
          path: DUO-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
      - name: Journal de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duo-build-device-log
          path: TestResults/build-device.log
          retention-days: 2
          if-no-files-found: ignore
